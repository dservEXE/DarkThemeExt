name: Build extension package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and publish
        shell: pwsh
        run: |
          node tools/build.cjs
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $v=(Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          gh release view "v$v" --json tagName 2>$null
          if($LASTEXITCODE -eq 0){exit 0}
          Compress-Archive -Path extension -DestinationPath DarkThemeExt.zip
          gh release create "v$v" DarkThemeExt.zip --target $env:GITHUB_SHA --title "DarkThemeExt $v" --notes 'Brave/Chromium unpacked extension. Extract and load the extension folder; keep that folder while the extension is installed.' --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed.'}
